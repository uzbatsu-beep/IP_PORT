name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup show
      - name: Check code formatting and repository Markdown links
        run: python3 scripts/preflight.py --format-only
      - name: Test engineering scripts
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

  check:
    name: Test & Clippy (${{ matrix.os }})
    needs: fmt
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned toolchain and target
        run: |
          rustup show
          rustup target add ${{ matrix.target }}
          rustc --version --verbose
          cargo --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}

      - name: Lint with Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run functional and isolated performance tests
        run: python scripts/preflight.py --tests-only

      - name: Optimized Performance QA
        run: python scripts/performance.py

      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-${{ matrix.target }}
          path: |
            target/performance-report.json
            target/live-performance-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Build optimized release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ip_port_scanner-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/ip_port_scanner
            target/${{ matrix.target }}/release/ip_port_scanner.exe
            THIRD_PARTY_NOTICES.md
            third-party/epaint_default_fonts/
          if-no-files-found: error
          retention-days: 7

  msrv:
    name: Minimum Supported Rust Version (MSRV 1.95.0)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install minimum supported toolchain
        run: rustup toolchain install 1.95.0 --profile minimal

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check compilation on MSRV
        run: cargo +1.95.0 check --locked --all-targets

  dependencies:
    name: Dependency Audit
    needs: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain and audit tools
        run: |
          rustup show
          cargo +1.100.0 install --locked --version 0.23.0 cargo-audit
          cargo +1.100.0 install --locked --version 0.22.1 cargo-deny
      - name: RustSec audit
        shell: bash
        run: |
          set -o pipefail
          cargo audit --json | tee cargo-audit.json
      - name: Dependency policy
        if: always()
        shell: bash
        run: |
          set -o pipefail
          status=0
          cargo deny --locked --format json check > cargo-deny.json 2> cargo-deny-diagnostics.json || status=$?
          python3 - <<'PY'
          import json
          from pathlib import Path
          for line in Path("cargo-deny-diagnostics.json").read_text(encoding="utf-8").splitlines():
              try:
                  record = json.loads(line)
                  fields = record.get("fields", {})
                  if record.get("type") == "summary":
                      print(json.dumps(fields))
                  elif fields.get("severity") in ("error", "warning"):
                      print(f"{fields['severity']}: {fields.get('code', '')}: {fields.get('message', '')}")
                      for label in fields.get("labels", []):
                          if label.get("message"):
                              print(f"  {label['message']}: {label.get('span', '')}")
              except (ValueError, TypeError, AttributeError):
                  print(line)
          PY
          exit "$status"
      - name: Upload dependency reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-audit
          path: |
            cargo-audit.json
            cargo-deny.json
            cargo-deny-diagnostics.json
          if-no-files-found: error
          retention-days: 30

  quality-gate:
    name: Quality Gate
    needs: [fmt, check, msrv, dependencies]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all mandatory checks
        env:
          FORMAT: ${{ needs.fmt.result }}
          MATRIX: ${{ needs.check.result }}
          MSRV: ${{ needs.msrv.result }}
          DEPS: ${{ needs.dependencies.result }}
        run: |
          set -euo pipefail
          printf 'format=%s matrix=%s msrv=%s dependencies=%s\n' "$FORMAT" "$MATRIX" "$MSRV" "$DEPS"
          test "$FORMAT" = success
          test "$MATRIX" = success
          test "$MSRV" = success
          test "$DEPS" = success
