name: Windows Preview Release

on:
  workflow_dispatch:
    inputs:
      preview_number:
        description: "Positive preview sequence for this Cargo version"
        required: true
        default: "1"
        type: string

permissions:
  contents: read

concurrency:
  group: windows-preview-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require successful exact-SHA main CI and Windows QA
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/verify_release_ci.py --windows-preview
      - name: Derive unique preview tag
        id: version
        env:
          PREVIEW_NUMBER: ${{ inputs.preview_number }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import tomllib
          with open("Cargo.toml", "rb") as source:
              version = tomllib.load(source)["package"]["version"]
          number = os.environ["PREVIEW_NUMBER"]
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version):
              raise SystemExit("Expected stable Cargo version")
          if not re.fullmatch(r"[1-9][0-9]{0,5}", number):
              raise SystemExit("Invalid preview sequence")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              print(f"version={version}", file=out)
              print(f"tag=preview-windows-v{version}-{number}", file=out)
          PY

  build:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build pinned locked Windows x64
        run: |
          rustup show
          rustup target add x86_64-pc-windows-msvc
          cargo build --locked --release --target x86_64-pc-windows-msvc
      - name: Package portable ZIP
        shell: pwsh
        env:
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $Name = "ip_port_scanner-$env:TAG-x86_64-pc-windows-msvc"
          New-Item -ItemType Directory -Path "dist/$Name" -Force | Out-Null
          Copy-Item "target/x86_64-pc-windows-msvc/release/ip_port_scanner.exe" "dist/$Name/"
          Copy-Item "*.md" "dist/$Name/"
          Copy-Item "LICENSE" "dist/$Name/"
          Copy-Item "third-party" "dist/$Name/" -Recurse
          Compress-Archive -Path "dist/$Name/*" -DestinationPath "dist/$Name.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-preview-package
          path: dist/*.zip
          if-no-files-found: error

  publish:
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Recheck exact-SHA gate before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/verify_release_ci.py --windows-preview
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-preview-package
          path: release-artifacts
      - name: Validate ZIP and generate SHA-256
        working-directory: release-artifacts
        env:
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          FILE="ip_port_scanner-${TAG}-x86_64-pc-windows-msvc.zip"
          test -s "$FILE"
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 1
          unzip -t "$FILE"
          python3 - "$FILE" <<'PY'
          import sys
          import zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              names = set(z.namelist())
              required = {"ip_port_scanner.exe", "LICENSE", "THIRD_PARTY_NOTICES.md"}
              if not required <= names or not any(n.startswith("third-party/epaint_default_fonts/") and not n.endswith("/") for n in names):
                  raise SystemExit("Missing executable or license notices")
          PY
          sha256sum "$FILE" > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Publish Windows prerelease without replacing stable release
        working-directory: release-artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          # Refuse existing tags; never repoint a previously published artifact.
          refs=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$TAG" --jq 'length')
          test "$refs" -eq 0
          cat > notes.md <<EOF
          Windows x64 preview of IP_PORT $VERSION.
          Source commit: $GITHUB_SHA.
          Exact main CI, Windows QA and Quality Gate passed.
          Includes portable ZIP, license notices and SHA-256 manifest.
          Linux/macOS builds and manual equipment acceptance are deferred.
          This is a prerelease, not the stable multi-platform release.
          EOF
          gh release create "$TAG" "ip_port_scanner-${TAG}-x86_64-pc-windows-msvc.zip" SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "IP_PORT v$VERSION — Windows Preview (${TAG##*-})" --notes-file notes.md
