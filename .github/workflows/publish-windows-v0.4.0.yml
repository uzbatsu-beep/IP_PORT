# Windows-only immediate release while the regular multi-platform build finishes.
# This helper lives only on a release branch and removes itself.
name: Publish Windows v0.4.0 now
on:
  push:
    branches: [release/publish-v0.4.0]
    paths: [.github/workflows/publish-windows-v0.4.0.yml]
permissions:
  contents: write
  actions: read
jobs:
  publish-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify v0.4.0 tag points to validated main commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin refs/tags/v0.4.0
          test "$(git rev-parse 'refs/tags/v0.4.0^{}')" = "ed4f81b3ad938fe9d10e07d3165c91cb2be6e6e1"
      - name: Download completed Windows package from release matrix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download 44744056872 --repo "$GITHUB_REPOSITORY" \
            --name package-x86_64-pc-windows-msvc --dir dist
          test -s dist/ip_port_scanner-v0.4.0-x86_64-pc-windows-msvc.zip
      - name: Calculate SHA-256 for published ZIP
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum ip_port_scanner-v0.4.0-x86_64-pc-windows-msvc.zip > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt
      - name: Publish verified Windows archive and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          # IP_PORT v0.4.0
          Official Windows x64 ZIP, built from the validated `main` commit `ed4f81b3`.

          Includes scan target exclusions, background PTR diagnostics, Windows IPv4/IPv6 neighbor-cache MAC/OUI identification, official IEEE MA-L/MA-M/MA-S CSV import, and persistent background OUI caching.

          **Verification:** download `SHA256SUMS.txt` and run:
          ```powershell
          (Get-FileHash .\\ip_port_scanner-v0.4.0-x86_64-pc-windows-msvc.zip -Algorithm SHA256).Hash
          ```
          Compare against the checksum file.

          Linux/macOS packages are being built by the standard multi-platform release workflow and may be added to this same release.
          EOF
          if gh release view v0.4.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v0.4.0 dist/ip_port_scanner-v0.4.0-x86_64-pc-windows-msvc.zip dist/SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create v0.4.0 --verify-tag --repo "$GITHUB_REPOSITORY" \
              --title "IP_PORT v0.4.0" --notes-file release-notes.md \
              dist/ip_port_scanner-v0.4.0-x86_64-pc-windows-msvc.zip dist/SHA256SUMS.txt
          fi
      - name: Remove disposable helper from release branch
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/publish-windows-v0.4.0.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove one-time Windows release publisher"
          git push origin HEAD:refs/heads/release/publish-v0.4.0
