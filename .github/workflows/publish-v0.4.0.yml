# Disposable release orchestration on a separate branch; never mutates main.
name: Publish verified v0.4.0
on:
  push:
    branches: [release/publish-v0.4.0]
    paths: [.github/workflows/publish-v0.4.0.yml]

permissions:
  contents: write
  actions: write

jobs:
  tag-and-dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify audited main SHA and unused release tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          VERIFIED_SHA="ed4f81b3ad938fe9d10e07d3165c91cb2be6e6e1"
          MAIN_SHA="$(git rev-parse refs/remotes/origin/main)"
          if [[ "$MAIN_SHA" != "$VERIFIED_SHA" ]]; then
            echo "::error::Main has changed since release validation. Expected $VERIFIED_SHA, found $MAIN_SHA."
            exit 1
          fi
          if git ls-remote --exit-code origin refs/tags/v0.4.0; then
            echo "::error::v0.4.0 already exists. Refusing to overwrite the tag."
            exit 1
          fi
          test "$(git cat-file -t "$VERIFIED_SHA")" = commit
      - name: Create immutable v0.4.0 tag at tested main commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v0.4.0 ed4f81b3ad938fe9d10e07d3165c91cb2be6e6e1             -m "IP_PORT v0.4.0: verified cross-platform release"
          git push origin refs/tags/v0.4.0
      - name: Dispatch existing audited multi-platform release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref v0.4.0
          echo "Release workflow dispatched for tag v0.4.0"
      - name: Remove temporary workflow from release branch
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/publish-v0.4.0.yml
          git commit -m "chore: remove one-time v0.4.0 release launcher"
          git push origin HEAD:refs/heads/release/publish-v0.4.0
