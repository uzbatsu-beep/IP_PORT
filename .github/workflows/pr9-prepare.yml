name: Prepare PR9 Rust formatting
on:
  push:
    branches: [feat/pr-9-oui-background-persistent-import]
    paths: [.github/workflows/pr9-prepare.yml]
permissions:
  contents: write
jobs:
  prep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format all Rust code
        run: cargo fmt --all
      - name: Remove helper and commit formatting
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/pr9-prepare.yml
          git add -A
          git diff --cached --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: format OUI background import and cache tests"
          git push origin HEAD:refs/heads/feat/pr-9-oui-background-persistent-import
