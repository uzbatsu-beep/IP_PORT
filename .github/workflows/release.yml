name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: ip_port_scanner.exe
            archive_ext: zip
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: ip_port_scanner
            archive_ext: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: ip_port_scanner
            archive_ext: tar.gz
          - target: x86_64-apple-darwin
            os: macos-13
            artifact_name: ip_port_scanner
            archive_ext: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libxkbcommon-dev \
            libwayland-dev \
            libgl1-mesa-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package archive (Windows)
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        run: |
          $Tag = "${{ github.ref_name }}"
          if (-not $Tag) { $Tag = "v0.1.0" }
          $ArchiveName = "ip_port_scanner-${Tag}-${{ matrix.target }}"
          New-Item -ItemType Directory -Path "dist/$ArchiveName" -Force | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/ip_port_scanner.exe" "dist/$ArchiveName/"
          Copy-Item "README.md" "dist/$ArchiveName/"
          Copy-Item "LICENSE" "dist/$ArchiveName/"
          Copy-Item "CHANGELOG.md" "dist/$ArchiveName/" -ErrorAction SilentlyContinue
          Compress-Archive -Path "dist/$ArchiveName/*" -DestinationPath "dist/${ArchiveName}.zip" -Force

      - name: Package archive (Unix)
        if: matrix.archive_ext == 'tar.gz'
        run: |
          TAG="${{ github.ref_name }}"
          [ -z "$TAG" ] && TAG="v0.1.0"
          ARCHIVE_NAME="ip_port_scanner-${TAG}-${{ matrix.target }}"
          mkdir -p "dist/${ARCHIVE_NAME}"
          cp "target/${{ matrix.target }}/release/ip_port_scanner" "dist/${ARCHIVE_NAME}/"
          cp README.md LICENSE "dist/${ARCHIVE_NAME}/"
          [ -f CHANGELOG.md ] && cp CHANGELOG.md "dist/${ARCHIVE_NAME}/"
          tar -czf "dist/${ARCHIVE_NAME}.tar.gz" -C dist "${ARCHIVE_NAME}"

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target }}
          path: dist/*.${{ matrix.archive_ext }}

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: package-*
          merge-multiple: true

      - name: Compute SHA-256 checksums
        working-directory: release-artifacts
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release-artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
