name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-ci-gate:
    name: Verify exact release commit CI
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require successful main CI and Quality Gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/verify_release_ci.py

  build-release:
    needs: release-ci-gate
    name: Build (${{ matrix.target }})
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: ip_port_scanner.exe
            archive_ext: zip
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: ip_port_scanner
            archive_ext: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: ip_port_scanner
            archive_ext: tar.gz
          - target: x86_64-apple-darwin
            os: macos-15-intel
            artifact_name: ip_port_scanner
            archive_ext: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate release tag and Cargo package version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          [[ "$TAG" =~ ^v[0-9]+[.][0-9]+[.][0-9]+$ ]] || {
            echo "::error::Expected exact SemVer tag (vX.Y.Z), got $TAG"
            exit 1
          }
          VERSION="${TAG#v}"
          grep -Fqx "version = \"$VERSION\"" Cargo.toml || {
            echo "::error::Cargo.toml version does not match tag $TAG"
            exit 1
          }

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libxkbcommon-dev \
            libwayland-dev \
            libgl1-mesa-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev

      - name: Install pinned toolchain and target
        run: |
          rustup show
          rustup target add ${{ matrix.target }}
          rustc --version --verbose
          cargo --version

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package archive (Windows)
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        run: |
          $Tag = "${{ github.ref_name }}"
          if (-not $Tag) { $Tag = "v0.1.0" }
          $ArchiveName = "ip_port_scanner-${Tag}-${{ matrix.target }}"
          New-Item -ItemType Directory -Path "dist/$ArchiveName" -Force | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/ip_port_scanner.exe" "dist/$ArchiveName/"
          Copy-Item "*.md" "dist/$ArchiveName/"
          Copy-Item "LICENSE" "dist/$ArchiveName/"
          Compress-Archive -Path "dist/$ArchiveName/*" -DestinationPath "dist/${ArchiveName}.zip" -Force

      - name: Package archive (Unix)
        if: matrix.archive_ext == 'tar.gz'
        run: |
          TAG="${{ github.ref_name }}"
          [ -z "$TAG" ] && TAG="v0.1.0"
          ARCHIVE_NAME="ip_port_scanner-${TAG}-${{ matrix.target }}"
          mkdir -p "dist/${ARCHIVE_NAME}"
          cp "target/${{ matrix.target }}/release/ip_port_scanner" "dist/${ARCHIVE_NAME}/"
          cp ./*.md LICENSE "dist/${ARCHIVE_NAME}/"
          tar -czf "dist/${ARCHIVE_NAME}.tar.gz" -C dist "${ARCHIVE_NAME}"

      - name: Upload release asset
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ matrix.target }}
          path: dist/*.${{ matrix.archive_ext }}

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download all packaged artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-artifacts
          pattern: package-*
          merge-multiple: true

      - name: Verify complete release archives and compute SHA-256
        working-directory: release-artifacts
        shell: bash
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          for TARGET in x86_64-pc-windows-msvc x86_64-unknown-linux-gnu aarch64-apple-darwin x86_64-apple-darwin; do
            EXT=tar.gz
            [[ "$TARGET" == *windows-msvc ]] && EXT=zip
            test -s "ip_port_scanner-${TAG}-${TARGET}.${EXT}" || {
              echo "::error::Missing package for $TARGET"
              exit 1
            }
          done
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 4
          LC_ALL=C sha256sum ip_port_scanner-* > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release-artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
