name: Cross-platform Acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-platform-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Test & Clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libxkbcommon-dev \
            libwayland-dev \
            libgl1-mesa-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev

      - name: Install pinned toolchain and target
        run: |
          rustup show
          rustup target add ${{ matrix.target }}
          rustc --version --verbose
          cargo --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}

      - name: Lint with Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run functional and isolated performance tests
        run: python scripts/preflight.py --tests-only

      - name: Optimized Performance QA
        run: python scripts/performance.py

      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-${{ matrix.target }}
          path: |
            target/performance-report.json
            target/live-performance-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Build optimized release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ip_port_scanner-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/ip_port_scanner
            target/${{ matrix.target }}/release/ip_port_scanner.exe
            THIRD_PARTY_NOTICES.md
            third-party/epaint_default_fonts/
          if-no-files-found: error
          retention-days: 7

  cross-platform-gate:
    name: Cross-platform Gate
    needs: check
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all deferred platform checks
        env:
          MATRIX: ${{ needs.check.result }}
        run: test "$MATRIX" = success
