name: Prepare PR 7 formatting and CSV lockfile
on:
  push:
    branches: [feat/pr-7-ieee-oui-interface-ptr-deadlines]
    paths: [.github/workflows/pr7-prepare.yml]
permissions:
  contents: write
jobs:
  prep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Lock CSV package versions
        run: cargo metadata --format-version 1 > /dev/null
      - name: Format all Rust sources
        run: cargo fmt --all
      - name: Delete one-time prep workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/pr7-prepare.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: rustfmt and lock IEEE CSV reader for PR7"
          git push origin HEAD:refs/heads/feat/pr-7-ieee-oui-interface-ptr-deadlines
