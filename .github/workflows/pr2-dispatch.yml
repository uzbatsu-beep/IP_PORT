# Disposable CI dispatch for bot-authored PR pending workflow approval.
name: Trigger v0.4.0 branch CI
on:
  push:
    branches:
      - feat/pr-2-network-discovery-v0.4.0
    paths:
      - .github/workflows/pr2-dispatch.yml

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Remove helper and start regular CI on this exact branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/pr2-dispatch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove one-time PR branch CI launcher"
          git push origin HEAD:refs/heads/feat/pr-2-network-discovery-v0.4.0
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref feat/pr-2-network-discovery-v0.4.0
          echo "Dispatched CI for branch HEAD after helper removal."
