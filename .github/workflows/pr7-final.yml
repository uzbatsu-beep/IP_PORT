name: PR7 complete cross-platform verification
on:
  push:
    branches: [feat/pr-7-ieee-oui-interface-ptr-deadlines]
    paths: [.github/workflows/pr7-final.yml]
permissions:
  contents: write
  actions: write
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove helper and dispatch CI
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/pr7-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove temporary PR7 final CI helper"
          git push origin HEAD:refs/heads/feat/pr-7-ieee-oui-interface-ptr-deadlines
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref feat/pr-7-ieee-oui-interface-ptr-deadlines
