[package]
name = "ip_port_scanner"
version = "0.5.0"
edition = "2024"
rust-version = "1.95"
description = "Fast cross-platform async TCP and UDP port scanner with a modern egui interface"
license = "MIT"
readme = "README.md"
keywords = ["port-scanner", "network", "tcp", "udp", "egui"]
categories = ["network-programming", "gui"]

[dependencies]
eframe = { version = "0.37", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui = "0.37"
egui_extras = "0.37"
get_if_addrs = "0.5"
dns-lookup = "2.0"
csv = "1.4"
ipnet = "2"
rfd = "0.18"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "net",
    "time",
    "sync",
    "io-util",
    "macros",
] }
tokio-util = "0.7"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[target.'cfg(windows)'.dependencies]
# Native, read-only IPv4/IPv6 ARP/NDP cache enumeration via GetIpNetTable2.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
] }
